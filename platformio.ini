[platformio]
monitor_dir = /home/llama/bin/pio/monitor
default_envs = esp32-s3-devkitm-1, esp32dev
[common]
platform = espressif32
framework = espidf
upload_speed = 115200
monitor_speed = 115200
board_build.esp-idf.sdkconfig = sdkconfig.defaults
monitor_filters =
    colorize
    esp32_exception_decoder
; build_flags = 
; 	-Wno-unused-variable
; 	-Wno-unused-function
; 	-Wno-write-strings
; 	-Wno-error=parentheses
; 	-Wno-error=missing-braces
; 	-Werror=incompatible-pointer-types
; 	-Wno-override-init
; -D CONFIG_BT_NIMBLE_ENABLED
; -D CONFIG_WIFI_SOCKET_ENABLED
; -D CONFIG_DAC_ENABLED


[env:esp32-s3-devkitm-1]
; The Xiao ESP32-S3  from Seeed Studio is the best fit for this project but almost any esp32 board can be used
extends = common
board = seeed_xiao_esp32s3
board_build.partitions = 8mb_spiffs.csv
board_upload.flash_size = 8MB
build_flags = 
	-D PRESSURE_GPIO=ADC_CHANNEL_0 ;maps to gpio 0, labeled D0
	; -D ADC_UNIT=ADC_UNIT_1 
	-D LED_GPIO=21
	-D LED_TYPE=LED_TYPE_MONO
	; -D PRESSURE_SDA=47
	; -D PRESSURE_SCL=48

[env:adafruit_qtpy_esp32s3_nopsram]
; Adafruit QTPY ESP32-S3 has the most features for this project if combined with the BFF
extends = common
board = esp32-s3-devkitm-1 #adafruit_qtpy_esp32s3_nopsram (upload bug with pio)
board_build.partitions = 8mb_spiffs.csv
board_upload.flash_size = 8MB
board_build.esp-idf.sdkconfig = sdkconfig.esp32-s3-devkitm-1
build_flags = 
	-D PRESSURE_GPIO=ADC_CHANNEL_0 
	-D LED_GPIO=39
	-D LED_POWER=38
	-D LED_TYPE=LED_TYPE_WS2812
	-D LED_FORMAT=2
	-D SLEEP_GPIO=0


[env:esp32-c6-devkitm-1]
; The Xiao ESP32-C6 is a great budget option if you don't need the features of the S3, but it only has a single ADC channel and no I2C so it's not as flexible
extends = common
board = esp32-c6-devkitm-1
board_build.partitions = min_spiffs.csv
board_upload.flash_size = 4MB
build_flags = 
	-D LED_GPIO=15
	-D LED_TYPE=LED_TYPE_MONO
	; -D PRESSURE_SDA=22
	; -D PRESSURE_SCL=23
	-D LOG_LOCAL_LEVEL=ESP_LOG_DEBUG

[env:waveshare_esp32_s3_amoled_1_32]
; The Waveshare ESP32-S3 AMOLED 1.32" is a great option if you want a built in display and other features
extends = common
board = esp32-s3-devkitm-1
board_build.partitions = 8mb_spiffs.csv
board_upload.flash_size = 8MB
build_flags = 
	-D LED_GPIO=-1
	-D LED_TYPE=LED_TYPE_WS2812

[env:waveshare_esp32_s3_zero]
; The Waveshare ESP32-S3 Zero has a built in ws2812 LED but no battery charging circuit
extends = common
board = waveshare_esp32_s3_zero
board_build.partitions = min_spiffs.csv
board_upload.flash_size = 4MB
build_flags = 
	-D LED_GPIO=39
	-D LED_TYPE=LED_TYPE_WS2812

[env:esp32dev]
; The ESP32 DevKit is the most basic option and should work fine for offbrand boards
extends = common
board = esp32dev
platform = espressif32@6.12.0
debug_tool = esp-prog
board_upload.flash_size = 4MB
platform_packages = framework-espidf@3.50500
monitor_dtr = 0
monitor_rts = 0
board_build.partitions = min_spiffs.csv
build_flags = 
	-D LED_GPIO=2
	-D LED_TYPE=LED_TYPE_MONO

